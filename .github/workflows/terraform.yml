name: "Terraform CI/CD"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      plan_destroy:
        description: 'Planejar o terraform destroy?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      destroy:
        description: 'Executar o terraform destroy?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_iam_instance_profile: ${{ secrets.IAM_INSTANCE_PROFILE }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        run: terraform apply --auto-approve tfplan.tfout
        if: ${{ github.event.inputs.apply == 'true' }}  

      - name: Plan Destroy
        run: terraform plan --destroy -out=tfplan.tfout
        if: ${{ github.event.inputs.plan_destroy  == 'true' }}  

      - name: Terraform Destroy
        run: terraform apply --destroy --auto-approve tfplan.tfout
        if: ${{ github.event.inputs.destroy  == 'true' }}  